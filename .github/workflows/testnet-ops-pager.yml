name: Testnet ops pager

# Pages only when a probe flips. A green run with no message is success.
# Secrets: RENDER_API_KEY, BASE_SEPOLIA_RPC_URL. Optional OPS_PAGER_NTFY_TOPIC.
# Do not print those values.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: testnet-ops-pager
  cancel-in-progress: false

jobs:
  page:
    name: Probe and page on flip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Restore previous pager state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp
          ids=$(gh run list --workflow testnet-ops-pager.yml --status success --limit 40 --json databaseId --jq '.[].databaseId')
          for id in $ids; do
            rm -rf tmp/pager-restore
            gh run download "$id" --name pager-state --dir tmp/pager-restore || continue
            found=$(find tmp/pager-restore -name testnet-ops-pager-state.json -print -quit)
            if [ -n "$found" ]; then
              cp "$found" tmp/testnet-ops-pager-state.json
              break
            fi
          done
          rm -rf tmp/pager-restore

      - name: Run pager
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          OPS_PAGER_NTFY_TOPIC: ${{ secrets.OPS_PAGER_NTFY_TOPIC }}
          OPS_PAGER_ALCHEMY_CAP_USD: ${{ vars.OPS_PAGER_ALCHEMY_CAP_USD || '30' }}
          OPS_PAGER_ALCHEMY_USD_PER_MILLION_CU: ${{ vars.OPS_PAGER_ALCHEMY_USD_PER_MILLION_CU || '0.525' }}
          OPS_PAGER_ALCHEMY_POLL_INTERVAL_MS: ${{ vars.OPS_PAGER_ALCHEMY_POLL_INTERVAL_MS || '12000' }}
          OPS_PAGER_ALCHEMY_LOG_WINDOW: ${{ vars.OPS_PAGER_ALCHEMY_LOG_WINDOW || '10000' }}
          OPS_PAGER_ALCHEMY_EVENT_HEADERS_PER_POLL: ${{ vars.OPS_PAGER_ALCHEMY_EVENT_HEADERS_PER_POLL || '0' }}
          OPS_PAGER_ALCHEMY_BASELINE_MONTHLY_CU: ${{ vars.OPS_PAGER_ALCHEMY_BASELINE_MONTHLY_CU || '10000000' }}
          OPS_PAGER_ALCHEMY_WARNING_FRACTION: ${{ vars.OPS_PAGER_ALCHEMY_WARNING_FRACTION || '0.7' }}
          OPS_PAGER_GITHUB_ISSUE: '1'
          GH_TOKEN: ${{ github.token }}
        run: node scripts/testnet-ops-pager.mjs

      - name: Save pager state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pager-state
          path: tmp/testnet-ops-pager-state.json
          if-no-files-found: ignore
          retention-days: 90
