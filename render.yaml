      - key: ALIGNMENT_TRUST_BOOTSTRAP_PRIVATE_KEY
        sync: false  # Secret: dedicated funded hot wallet
      - key: START_BLOCK
        value: "42768673"
      - key: STATE_FILE
        value: /data/alignment-trust-bootstrap.base-sepolia.json
      - key: DENYLIST_FILE
        value: /data/denylist.txt
      - key: PAUSE_FILE
        value: /data/PAUSED
      - key: CONFIRMATIONS
        value: "12"
      - key: BLOCK_RANGE
