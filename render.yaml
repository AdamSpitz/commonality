      # watcher limit can otherwise crash startup with EMFILE while watching /app.
      - key: CHOKIDAR_USEPOLLING
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: commonality-indexer-db
          property: connectionString
      - key: DATABASE_SCHEMA
        value: commonality_base_sepolia_v6
