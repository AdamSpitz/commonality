ryEscrow\":[{\"address\":\"0x311563095515d4E0C01404fE154effc6e49208FA\",\"startBlock\":47467735}],\"CreatorAssuranceDeployer\":[{\"address\":\"0xd304AD671094F0D8f3d4621abdE91Fd0Fd8A12eF\",\"startBlock\":47467736}],\"CreatorAssuranceContractFactory\":[{\"address\":\"0x0e203232c448D9ECA86f642AD4616ffF90e7a437\",\"startBlock\":47467737}],\"CreatorAssuranceVeto\":[{\"address\":\"0xeb1C857Ad97AFd32C843273784adb4e9EDffE078\",\"startBlock\":42768673}],\"ProspectiveContentRoundFactory\":[{\"address\":\"0xCA099F3d63a996D9E479Eb6D220Bf6B3e8407F4C\",\"startBlock\":47467739}]}}}"
      - key: START_BLOCK
        value: "42768673"
      - key: BELIEFS_CONTRACT_ADDRESS
        value: "0x353d650D50d8a5eA3A5a966FE1690177a8a82D92"
