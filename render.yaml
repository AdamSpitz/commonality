# Generated by scripts/generate-render-yaml.mjs from deployments/base-sepolia.env
# Do not edit directly — edit render.yaml.template instead.
# Default env file: deployments/base-sepolia.env

databases:
  - name: commonality-indexer-db
    plan: basic-256mb
    postgresMajorVersion: 16

services:
  # Commonality's browser-facing, read-only LLM helpers. This process never
  # receives the coherence badge private key; chain writes belong to the worker.
  - type: web
    name: commonality-cause-assist
    env: docker
    rootDir: .
    dockerContext: .
    dockerfilePath: cause-assist/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: XAI_API_KEY
        sync: false  # Secret; used when OPENROUTER_API_KEY is unset
      - key: OPENROUTER_API_KEY
        sync: false  # Preferred: cheap deepseek/deepseek-v4-flash-0731
      # Do not pin CAUSE_ASSIST_API_BASE_URL or CAUSE_ASSIST_*_MODEL here.
      # loadConfigFromEnv picks OpenRouter+flash when OPENROUTER_API_KEY is set,
      # otherwise xAI + grok-4.5. Pinning OpenRouter's URL with only XAI_API_KEY
      # caused live 401s (xAI credential sent to OpenRouter).
      - key: CAUSE_ASSIST_COHERENCE_ATTESTER_ADDRESS
        value: "0x39e477B6D9776244849eea9f79FC890ADB25cCbA"
    healthCheckPath: /health
    autoDeploy: true
    plan: starter

  # Trusted roster coherence badge writer. This is the only deployed process
  # that receives the operator private key; it has no browser-facing endpoint.
  - type: worker
    name: commonality-coherence-badge-worker
    env: docker
    rootDir: .
    dockerContext: .
    dockerfilePath: coherence-badge-worker/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: RPC_URL
        sync: false  # Secret: Base Sepolia RPC provider URL
      - key: CHAIN_ID
        value: "84532"
      - key: MUTABLE_REF_UPDATER_CONTRACT_ADDRESS
        value: "0x472f9A996546bcc7572692B002B63483F3cDB70e"
      - key: START_BLOCK
        value: "47467743"
      - key: ALIGNMENT_ATTESTATIONS_CONTRACT_ADDRESS
        value: "0xAc19417eE26f7795AEeAD374911932b412Ef808d"
      - key: PUBLISHED_DATA_CONTRACT_ADDRESS
        value: "0xC4074f563DA9E2b9751629e9A3213eB02099513e"
      - key: CAUSE_ASSIST_COHERENCE_ATTESTER_PRIVATE_KEY
        sync: false  # Secret: worker only; never add to cause-assist
      - key: XAI_API_KEY
        sync: false  # Secret
      - key: OPENROUTER_API_KEY
        sync: false  # Secret
      - key: CAUSE_ASSIST_API_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CAUSE_ASSIST_COHERENCE_MODEL
        value: deepseek/deepseek-v4-flash-0731
      - key: CAUSE_ASSIST_IPFS_GATEWAY_URL
        value: https://ipfs.io/ipfs
      - key: EVENT_CACHE_URL
        value: https://commonality-indexer.onrender.com
      - key: STATE_FILE
        # v2 replays refs missed while Render pointed PublishedData at an old contract.
        value: /data/coherence-badge-worker.base-sepolia.v2.json
      - key: CONFIRMATIONS
        value: "12"
      - key: BLOCK_RANGE
        value: "1000"
      - key: POLL_INTERVAL_MS
        value: "10000"
    disk:
      name: commonality-coherence-badge-worker-state
      mountPath: /data
      sizeGB: 1
    autoDeploy: true
    plan: starter

  # Commonality's shipped one-hop trust root. The durable disk holds the scan
