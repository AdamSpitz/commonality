      - key: TRUST_REGISTRY_ADDRESS
        value: "0x3a93BAB464Cc20333076b83490DE40357094355E"
      - key: ALIGNMENT_TRUST_BOOTSTRAP_PRIVATE_KEY
        sync: false  # Secret: dedicated funded hot wallet
      - key: START_BLOCK
        value: "42768673"
      - key: STATE_FILE
        value: /data/alignment-trust-bootstrap.base-sepolia.json
      - key: DENYLIST_FILE
        value: /data/denylist.txt
      - key: PAUSE_FILE
        value: /data/PAUSED
      - key: CONFIRMATIONS
        value: "12"
      - key: BLOCK_RANGE
        value: "1000"
      - key: POLL_INTERVAL_MS
        value: "10000"
      - key: BATCH_SIZE
        value: "50"
      - key: MAX_ADMISSIONS_PER_POLL
        value: "100"
    disk:
      name: commonality-alignment-trust-bootstrap-state
      mountPath: /data
      sizeGB: 1
    autoDeploy: true
    plan: starter

