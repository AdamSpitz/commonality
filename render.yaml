        value: 10000
      - key: PONDER_POLL_INTERVAL_MS
        value: "4000"
      - key: PONDER_RPC_MAX_RESPONSE_BODY_SIZE
        value: 0
      - key: INDEXER_DEPLOYMENT_MANIFEST
