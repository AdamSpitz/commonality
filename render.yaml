# Generated by scripts/generate-render-yaml.mjs from deployments/base-sepolia.env
# Do not edit directly — edit render.yaml.template instead.
# Default env file: deployments/base-sepolia.env

databases:
  - name: commonality-indexer-db
    plan: basic-256mb
    postgresMajorVersion: 16

services:
  # CauseStarter's browser-facing, read-only LLM helpers. This process never
  # receives the coherence badge private key; chain writes belong to the worker.
  - type: web
    name: commonality-cause-assist
    env: docker
    rootDir: .
    dockerContext: .
    dockerfilePath: cause-assist/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: XAI_API_KEY
        sync: false  # Secret
      - key: OPENROUTER_API_KEY
        sync: false  # Optional fallback secret
      - key: CAUSE_ASSIST_API_BASE_URL
        value: https://api.x.ai/v1
      - key: CAUSE_ASSIST_SUGGEST_MODEL
        value: grok-4.5
      - key: CAUSE_ASSIST_SAFETY_MODEL
        value: grok-4.5
      - key: CAUSE_ASSIST_IMPLICATION_MODEL
        value: grok-4.5
      - key: CAUSE_ASSIST_COHERENCE_MODEL
        value: grok-4.5
      - key: CAUSE_ASSIST_COHERENCE_ATTESTER_ADDRESS
        value: "0x39e477B6D9776244849eea9f79FC890ADB25cCbA"
    healthCheckPath: /health
    autoDeploy: true
    plan: starter

  # Trusted roster coherence badge writer. This is the only deployed process
  # that receives the operator private key; it has no browser-facing endpoint.
  - type: worker
    name: commonality-coherence-badge-worker
    env: docker
    rootDir: .
    dockerContext: .
    dockerfilePath: coherence-badge-worker/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: RPC_URL
        sync: false  # Secret: Base Sepolia RPC provider URL
      - key: CHAIN_ID
        value: "84532"
      - key: MUTABLE_REF_UPDATER_CONTRACT_ADDRESS
        value: "0x472f9A996546bcc7572692B002B63483F3cDB70e"
      - key: START_BLOCK
        value: "45094307"
      - key: ALIGNMENT_ATTESTATIONS_CONTRACT_ADDRESS
        value: "0xAc19417eE26f7795AEeAD374911932b412Ef808d"
      - key: PUBLISHED_DATA_CONTRACT_ADDRESS
        value: "0xee860Bb27652a3Be968bf6D351ee0eBb9d995eD3"
      - key: CAUSE_ASSIST_COHERENCE_ATTESTER_PRIVATE_KEY
        sync: false  # Secret: worker only; never add to cause-assist
      - key: XAI_API_KEY
        sync: false  # Secret
      - key: CAUSE_ASSIST_COHERENCE_MODEL
        value: grok-4.5
      - key: CAUSE_ASSIST_IPFS_GATEWAY_URL
        value: https://ipfs.io/ipfs
      - key: EVENT_CACHE_URL
        value: https://commonality-indexer.onrender.com
      - key: STATE_FILE
        value: /data/coherence-badge-worker.base-sepolia.json
      - key: CONFIRMATIONS
        value: "12"
      - key: BLOCK_RANGE
        value: "1000"
      - key: POLL_INTERVAL_MS
        value: "10000"
    disk:
      name: commonality-coherence-badge-worker-state
      mountPath: /data
      sizeGB: 1
    autoDeploy: true
    plan: starter

  # CauseStarter's shipped one-hop trust root. The durable disk holds the scan
