# Docker embedded DNS — resolve upstreams at request time so nginx can start
# even when indexer / platform-api-service / cause-assist are not on the network yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # More-specific API proxies first (before the general /api/ indexer proxy).

    # Cause assist (statement suggestions + safety filter)
    # Use host-only proxy_pass (no path) so the rewritten URI is forwarded intact.
    location /api/cause-assist/ {
        set $cause_assist_host cause-assist;
        rewrite ^/api/cause-assist/?(.*)$ /$1 break;
        proxy_pass http://$cause_assist_host:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Platform API (channel metadata, etc.)
    location /api/platform-api/ {
        set $platform_host platform-api-service;
        rewrite ^/api/platform-api/?(.*)$ /$1 break;
        proxy_pass http://$platform_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin proxy to the event cache / indexer.
    # Prefer the compose service name when the full stack is up; fall back to the
    # host-published port (host.docker.internal:42069) for standalone CauseStarter deploys.
    # INDEXER_UPSTREAM can override (host:port, no scheme).
    set $indexer_upstream indexer:42069;

    location /api/ {
        proxy_pass http://$indexer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    location /status {
        proxy_pass http://$indexer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
    }

    location /conceptspace {
        proxy_pass http://$indexer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
    }

    location /sql/ {
        proxy_pass http://$indexer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
    }

    location /graphql {
        proxy_pass http://$indexer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
    }

    # SPA: hash routing works without rewrites; keep try_files for assets.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the runtime config or shell HTML.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Immutable hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
